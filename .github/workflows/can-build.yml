name: can-build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: library + examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libsdl2-dev

      - name: Build (default tags)
        run: just build

      # The X11 and SDL2 backends only compile with their build tags.
      - name: Build platform backends (-tags x11,sdl2)
        run: just build-platform
