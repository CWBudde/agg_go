name: unit-tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: go test ./... (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64: SSE/AVX2 SIMD paths, no FMA fusion by the Go compiler.
          - arch: amd64
            runner: ubuntu-latest
          # arm64: NEON SIMD paths, and the Go compiler fuses x*y+z into FMA,
          # so this catches float expressions that are not FMA-proof.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The X11/SDL2 backends are behind the x11/sdl2 build tags, so the
      # default build needs no system GUI libraries.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  freetype:
    name: go test -tags freetype
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfreetype-dev libharfbuzz-dev

      - name: Build
        run: go build -tags freetype ./...

      # Packages that carry freetype-tagged code. `go vet -tags freetype` is not
      # run yet: internal/font/freetype2/engine.go still does uintptr pointer
      # arithmetic that vet's unsafeptr check rejects.
      - name: Test
        run: go test -tags freetype . ./internal/font/... ./internal/agg2d/...
