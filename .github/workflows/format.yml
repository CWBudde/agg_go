name: format

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install formatters
        run: |
          # treefmt: install prebuilt binary (go install is broken by an invalid
          # path inside the module zip), pinned to match the project's local version.
          curl -sSfL https://github.com/numtide/treefmt/releases/download/v2.5.0/treefmt_2.5.0_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin treefmt
          go install mvdan.cc/gofumpt@latest
          go install github.com/daixiang0/gci@latest
          npm install -g prettier@3.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run formatter
        run: just fmt

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted. Please run 'just fmt'"
            git diff
            exit 1
          fi
